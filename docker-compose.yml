version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: cloudproof-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cloudproof_user
      POSTGRES_PASSWORD: cloudproof_pass
      POSTGRES_DB: cloudproof_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudproof_user -d cloudproof_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cloudproof-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql+asyncpg://cloudproof_user:cloudproof_pass@postgres:5432/cloudproof_db
      - JWT_SECRET=dev_jwt_secret_change_in_production_min_32_chars
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=60
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cloudproof-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    ports:
      - "3000:3000"

volumes:
  postgres_data:

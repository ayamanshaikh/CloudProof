version: '3.8'

services:
  nginx:
    image: nginx:1.25-alpine
    container_name: cloudproof-nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./deployment/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - backend
      - frontend
    networks:
      - cloudproof-network

  postgres:
    image: postgres:16-alpine
    container_name: cloudproof-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cloudproof_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cloudproof_pass_change_in_prod}
      POSTGRES_DB: ${POSTGRES_DB:-cloudproof_db}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cloudproof_user} -d ${POSTGRES_DB:-cloudproof_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - cloudproof-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cloudproof-backend-prod
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-cloudproof_user}:${POSTGRES_PASSWORD:-cloudproof_pass_change_in_prod}@postgres:5432/${POSTGRES_DB:-cloudproof_db}
      - JWT_SECRET=${JWT_SECRET:-prod_secret_must_be_set_in_env_file_2026}
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost}
      - RATE_LIMIT_ENABLED=${RATE_LIMIT_ENABLED:-true}
      - AUTH_RATE_LIMIT=${AUTH_RATE_LIMIT:-10}
      - VERIFY_RATE_LIMIT=${VERIFY_RATE_LIMIT:-20}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - cloudproof-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-/api/v1}
    container_name: cloudproof-frontend-prod
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - cloudproof-network

networks:
  cloudproof-network:
    driver: bridge

volumes:
  postgres_prod_data:
  nginx_logs:
